name: Compilar APK Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK Platform 36 e Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v7
        with:
          name: fs20-mod-converter-pro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
